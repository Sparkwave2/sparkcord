#
# Swaps the API, worker and web app of the Fluxer compose bundle for the locally
# built Sparkcord images. Every other service runs the released Fluxer image.

services:
  api:
    image: ${SPARKCORD_API_IMAGE:-sparkcord/fluxer-api:dev}
    pull_policy: never
  worker:
    image: ${SPARKCORD_API_IMAGE:-sparkcord/fluxer-api:dev}
    pull_policy: never
  app-proxy:
    image: ${SPARKCORD_APP_IMAGE:-sparkcord/fluxer-app-proxy:dev}
    pull_policy: never
  # Peer-to-peer file sharing: WebTorrent tracker and ICE (STUN/TURN) config, routed
  # by the edge at /tracker and /tracker-ice (see tracker/tracker.caddy).
  tracker:
    build: ../tracker
    image: sparkcord/tracker:dev
    pull_policy: never
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks: [fluxer]
    environment:
      STUN_PRIMARY: ${FLUXER_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
      STUN_SECONDARY: ${FLUXER_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
      TURN_SERVERS: ${FLUXER_LIVEKIT_TURN_SERVERS:-[]}
      DEBUG: ${SPARKCORD_TRACKER_DEBUG:-}
      TURN_SECRET: ${SPARKCORD_TURN_SECRET:-}
      TURN_PORT: ${SPARKCORD_TURN_PORT:-3478}
  # TURN relay for peer-to-peer file sharing, for when two browsers can't reach each
  # other directly (same computer, strict routers). Both sides relay through it, so only
  # the listening port is published. Credentials are short-lived, made by the tracker's
  # /tracker-ice from SPARKCORD_TURN_SECRET (written to .env by dev.sh up).
  turn:
    image: coturn/coturn:4.6.3-alpine
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks: [fluxer]
    ports:
      - "${SPARKCORD_TURN_PORT:-3478}:3478/udp"
      - "${SPARKCORD_TURN_PORT:-3478}:3478/tcp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${SPARKCORD_TURN_SECRET:?run sparkcord/dev/dev.sh up}
      - --realm=sparkcord
      - --fingerprint
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
