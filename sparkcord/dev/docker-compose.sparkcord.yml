#
# Swaps the API, worker and web app of the Fluxer compose bundle for the locally
# built Sparkcord images. Every other service runs the released Fluxer image.

services:
  api:
    image: ${SPARKCORD_API_IMAGE:-sparkcord/fluxer-api:dev}
    pull_policy: never
  worker:
    image: ${SPARKCORD_API_IMAGE:-sparkcord/fluxer-api:dev}
    pull_policy: never
  app-proxy:
    image: ${SPARKCORD_APP_IMAGE:-sparkcord/fluxer-app-proxy:dev}
    pull_policy: never
  # Peer-to-peer file sharing: WebTorrent tracker and ICE (STUN/TURN) config, routed
  # by the edge at /tracker and /tracker-ice (see tracker/tracker.caddy).
  tracker:
    build: ../tracker
    image: sparkcord/tracker:dev
    pull_policy: never
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks: [fluxer]
    environment:
      STUN_PRIMARY: ${FLUXER_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
      STUN_SECONDARY: ${FLUXER_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
      TURN_SERVERS: ${FLUXER_LIVEKIT_TURN_SERVERS:-[]}
      DEBUG: ${SPARKCORD_TRACKER_DEBUG:-}
